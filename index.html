<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USATEC IMPORT - Salida de Equipos</title>
<style>
:root{--navy:#0b1f3a;--red:#e31b23;--line:#d8dee8;--soft:#f8fafc;--text:#111827;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--text)}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
.header{display:grid;grid-template-columns:280px 1fr 220px;align-items:center;gap:18px;margin-bottom:14px}
.logo{width:250px;height:90px;object-fit:contain;object-position:left center}
.title{text-align:center}
.title h1{margin:0;font-size:32px;color:var(--navy)}
.title div{margin-top:6px;color:var(--red);font-weight:800;letter-spacing:4px}
.datebox{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.datebox label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
.datebox input{border:0;padding:0;font-size:18px;font-weight:700;color:var(--navy);width:100%}

.block{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff}
.block-title{padding:11px 14px;border-bottom:1px solid var(--line);font-size:17px;font-weight:800;color:var(--navy);display:flex;justify-content:space-between;gap:16px;align-items:center}
.block-title .hint{font-size:12px;font-weight:700;color:var(--red);font-style:italic}
.block-body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.span1{grid-column:span 1} .span2{grid-column:span 2} .span3{grid-column:span 3} .span4{grid-column:span 4}
.span5{grid-column:span 5} .span6{grid-column:span 6} .span7{grid-column:span 7}
.span8{grid-column:span 8} .span12{grid-column:span 12}
label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:#1e293b}
.req label::after{content:" *";color:var(--red)}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:10px 11px;font-size:14px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 2px rgba(11,31,58,.08)}
.readonly{background:#f3f4f6}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.total-card{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--soft)}
.total-card b{display:block;font-size:13px;color:var(--navy);margin-bottom:6px}
.total-card span{font-size:28px;font-weight:900}
.total-card.red span{color:var(--red)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
button{border-radius:8px;padding:13px 18px;font-size:14px;font-weight:800;cursor:pointer}
.primary{background:var(--navy);border:1px solid var(--navy);color:#fff}
.secondary{background:#fff;border:1px solid #cbd5e1;color:var(--navy)}
.status{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;font-size:13px}
.status.ok{display:block;background:#ecfdf3;color:#05603a;border:1px solid #abefc6}
.status.err{display:block;background:#fef3f2;color:#b42318;border:1px solid #fecdca}

.imei-row{display:flex;gap:8px;align-items:stretch}
.imei-row input{min-width:0;flex:1}
.scan-btn{flex:0 0 auto;background:var(--red);color:#fff;border:1px solid var(--red);padding:10px 12px;border-radius:7px;font-size:12px;font-weight:800;cursor:pointer}
.scan-btn:hover{filter:brightness(.95)}
.scanner-box{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#07101f}
.scanner-box video{display:block;width:100%;max-height:280px;object-fit:cover;background:#07101f}
.scanner-guide{position:absolute;left:10%;right:10%;top:36%;height:28%;border:2px solid #fff;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.20);pointer-events:none}
.scanner-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 10px;background:#fff;font-size:12px;color:var(--muted)}
.scanner-close{border:1px solid #cbd5e1;background:#fff;color:var(--navy);padding:8px 10px;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer}

@media(max-width:850px){
 .header{grid-template-columns:1fr}
 .title{text-align:left}
 .two-col{grid-template-columns:1fr}
 .span1,.span2,.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}
 .summary{grid-template-columns:1fr}
}
@media print{
 .actions,.status{display:none!important}
 .wrap{max-width:none;padding:0}
 .block,.total-card{break-inside:avoid}
}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const money = v => Number(v || 0);
const fmt = v => "S/ " + Number(v || 0).toFixed(2);
const STORAGE_KEY = "usatec_salidas_v3";

const ids = [
  "fecha","tipoSalida","grupo","linea","modelo","modeloManual","color","sublineaColor","capacidad","costo","ventaEquipo",
  "cliente","dni","celular","accesorios","montoAccesorios","delivery","posFactura",
  "imei","proveedor","accesorios2","posFactura2","refPos","delivery2","montoAccesorios2",
  "efectivo","posZipago","vendedor","transferencia","montoTransferido","yapePlin","nroOp","validador"
];


const catalogo = {
  EQUIPOS: {
    SAMSUNG: {
      "Samsung S26 Ultra": ["Negro","Blanco","Azul/Celeste","Violeta"],
      "Samsung S25 Ultra": ["Titanium Black","Titanium Gray","Titanium Silverblue","Titanium Whitesilver"]
    },
    APPLE: {
      "iPhone 17": ["Negro","Blanco","Azul Niebla","Salvia","Lavanda"],
      "iPhone 16": ["Negro","Blanco","Rosa","Verde Azulado (Teal)","Ultramarino"],
      "iPhone 17 Pro": ["Silver","Cosmic Orange","Deep Blue"],
      "iPhone 17 Pro Max": ["Silver","Cosmic Orange","Deep Blue"]
    },
    XIAOMI: {
      "OTRO / ESCRIBIR MODELO": []
    }
  },
  ACCESORIOS: {
    CASE: {"CASE": []},
    MICA: {"MICA": []},
    CARGADOR: {"CARGADOR": []}
  }
};

function cargarLineas(){
  const grupo = $("grupo").value;
  const linea = $("linea");
  linea.innerHTML = '<option value="">Seleccionar línea</option>';
  $("modelo").innerHTML = '<option value="">Seleccionar modelo</option>';
  $("color").innerHTML = '<option value="">Seleccionar color</option>';
  $("modeloManual").style.display = "none";
  $("modeloManual").value = "";
  $("modelo").disabled = true;
  $("color").disabled = true;
  linea.disabled = !grupo;

  if (!grupo) {
    actualizarSublinea();
    return;
  }

  Object.keys(catalogo[grupo]).forEach(v => {
    const op = document.createElement("option");
    op.value = v;
    op.textContent = v;
    linea.appendChild(op);
  });
  actualizarSublinea();
}

function cargarModelos(){
  const grupo = $("grupo").value;
  const linea = $("linea").value;
  const modelo = $("modelo");

  modelo.innerHTML = '<option value="">Seleccionar modelo</option>';
  $("color").innerHTML = '<option value="">Seleccionar color</option>';
  $("modeloManual").style.display = "none";
  $("modeloManual").value = "";
  $("color").disabled = true;

  if (!grupo || !linea) {
    modelo.disabled = true;
    actualizarSublinea();
    return;
  }

  modelo.disabled = false;
  Object.keys(catalogo[grupo][linea]).forEach(v => {
    const op = document.createElement("option");
    op.value = v;
    op.textContent = v;
    modelo.appendChild(op);
  });

  actualizarSublinea();
}

function cargarColores(){
  const grupo = $("grupo").value;
  const linea = $("linea").value;
  const modelo = $("modelo").value;
  const color = $("color");

  color.innerHTML = '<option value="">Seleccionar color</option>';
  $("modeloManual").style.display = "none";
  $("modeloManual").value = "";

  if (!grupo || !linea || !modelo) {
    color.disabled = true;
    actualizarSublinea();
    return;
  }

  const colores = catalogo[grupo][linea][modelo] || [];

  if (modelo === "OTRO / ESCRIBIR MODELO") {
    $("modeloManual").style.display = "block";
  }

  if (grupo === "ACCESORIOS" || colores.length === 0) {
    color.disabled = true;
    color.removeAttribute("required");
  } else {
    color.disabled = false;
    color.setAttribute("required", "required");
    colores.forEach(v => {
      const op = document.createElement("option");
      op.value = v;
      op.textContent = v;
      color.appendChild(op);
    });
  }

  actualizarSublinea();
}

function actualizarSublinea(){
  const grupo = $("grupo").value;
  const linea = $("linea").value;
  let modelo = $("modelo").value;
  const manual = $("modeloManual").value.trim();
  const color = $("color").value;

  if (modelo === "OTRO / ESCRIBIR MODELO" && manual) modelo = manual;

  let valor = "";
  if (grupo === "EQUIPOS") {
    if (modelo && color) valor = modelo.toUpperCase() + " / " + color;
    else if (modelo) valor = modelo.toUpperCase();
  } else if (grupo === "ACCESORIOS") {
    if (linea) valor = linea;
  }

  $("sublineaColor").value = valor;
}


let scannerStream = null;
let scannerTimer = null;
let barcodeDetector = null;

function normalizarImei(texto){
  const soloDigitos = String(texto || "").replace(/\D/g, "");
  if (soloDigitos.length >= 14 && soloDigitos.length <= 17) return soloDigitos;
  return "";
}

async function iniciarEscanerImei(){
  const box = $("scannerBox");
  const video = $("scannerVideo");
  const msg = $("scannerMsg");

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("Este navegador no permite usar la cámara. Puedes escribir el IMEI manualmente.");
    return;
  }

  if (!("BarcodeDetector" in window)) {
    alert("La lectura automática de código de barras no está disponible en este navegador. Prueba Chrome/Edge actualizado o escribe el IMEI manualmente.");
    return;
  }

  try {
    barcodeDetector = new BarcodeDetector({
      formats: ["code_128","code_39","ean_13","ean_8","itf","upc_a","upc_e"]
    });

    scannerStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });

    video.srcObject = scannerStream;
    await video.play();
    box.hidden = false;
    msg.textContent = "Apunta la cámara al código de barras del IMEI.";

    const detectar = async () => {
      if (!scannerStream || video.readyState < 2) return;
      try {
        const codigos = await barcodeDetector.detect(video);
        if (codigos && codigos.length) {
          for (const codigo of codigos) {
            const valor = normalizarImei(codigo.rawValue);
            if (valor) {
              $("imei").value = valor;
              msg.textContent = "IMEI detectado: " + valor;
              cerrarEscanerImei();
              $("imei").focus();
              return;
            }
          }
        }
      } catch (e) {}
    };

    scannerTimer = setInterval(detectar, 350);

  } catch (err) {
    cerrarEscanerImei();
    alert("No se pudo abrir la cámara. Revisa el permiso de cámara del navegador.");
  }
}

function cerrarEscanerImei(){
  if (scannerTimer) {
    clearInterval(scannerTimer);
    scannerTimer = null;
  }
  if (scannerStream) {
    scannerStream.getTracks().forEach(t => t.stop());
    scannerStream = null;
  }
  const video = $("scannerVideo");
  if (video) video.srcObject = null;
  const box = $("scannerBox");
  if (box) box.hidden = true;
}

function calcular(){
  const costo = money($("costo").value);
  const venta = money($("ventaEquipo").value);
  const acc = $("accesorios").value;
  const h22 = money($("delivery").value);
  const h24 = money($("posFactura").value);
  const l28 = money($("posFactura2").value);
  const f30 = money($("delivery2").value);
  const l30 = money($("montoAccesorios2").value);

  let l24 = "";
  if(acc === "Case + Mica") l24 = 10;
  else if(acc === "Case + Cubo") l24 = 25;
  else if(acc === "Case + Mica + Cubo") l24 = 30;
  else if(acc === "Cubo") l24 = 20;
  else if(acc === "No") l24 = 0;

  $("montoAccesorios").value = l24 === "" ? "" : l24.toFixed(2);

  // J32 = L28 + F30 + L30 + N10
  const j32 = l28 + f30 + l30 + venta;

  // J41 = SI.ERROR(N10-(L10+L24+H24+H22);0)
  const j41 = venta - (costo + money(l24) + h24 + h22);

  // N41 = J32-(F35+N35+F37+L37)
  const n41 = j32 - (
    money($("efectivo").value) +
    money($("montoTransferido").value) +
    money($("posZipago").value) +
    money($("yapePlin").value)
  );

  $("totalCobrado").textContent = fmt(j32);
  $("utilidad").textContent = fmt(j41);
  $("validador").value = n41.toFixed(2);
}

function obtenerRegistro(){
  const r = {movimiento:"SALIDA"};
  ids.forEach(id => r[id] = $(id).value);
  r.sublineaColor = $("sublineaColor").value;
  r.totalCobrado = $("totalCobrado").textContent.replace("S/","").trim();
  r.utilidad = $("utilidad").textContent.replace("S/","").trim();
  r.timestamp = new Date().toISOString();
  return r;
}

function guardarLocal(registro){
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  data.push(registro);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

async function enviarABBDD(registro){
  const API_URL = "https://script.google.com/macros/s/AKfycbwaV5fLoxFVY_kVNBgHuQMVmWNpiyuMOTGDJSreKNxFfirW-2STDihi0PgkQXMnfwG2/exec";

  if (!API_URL || API_URL.includes("PEGA_AQUI")) {
    throw new Error("Falta configurar la URL de Google Sheets.");
  }

  const payload = {
    fecha: registro.fecha || "",
    movimiento: "SALIDA",
    tipoSalida: registro.tipoSalida || "",
    grupo: registro.grupo || "",
    linea: registro.linea || "",
    sublineaColor: registro.sublineaColor || registro.color || "",
    capacidad: registro.capacidad || "",
    costo: registro.costo || "",
    ventaEquipo: registro.ventaEquipo || "",
    imei: registro.imei || "",
    accesorios: registro.accesorios || "",
    montoAccesorios: registro.montoAccesorios || "",
    delivery: registro.delivery || "",
    posFactura: registro.posFactura || "",
    proveedor: registro.proveedor || "",
    cliente: registro.cliente || "",
    dni: registro.dni || "",
    celular: registro.celular || "",
    accesorios2: registro.accesorios2 || "",
    montoAccesorios2: registro.montoAccesorios2 || "",
    posFactura2: registro.posFactura2 || "",
    refPos: registro.refPos || "",
    delivery2: registro.delivery2 || "",
    efectivo: registro.efectivo || "",
    transferencia: registro.transferencia || "",
    montoTransferido: registro.montoTransferido || "",
    posZipago: registro.posZipago || "",
    yapePlin: registro.yapePlin || "",
    nroOp: registro.nroOp || "",
    vendedor: registro.vendedor || "",
    utilidad: registro.utilidad || "",
    totalCobrado: registro.totalCobrado || "",
    validador: registro.validador || ""
  };

  await fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });

  return true;
}

function limpiar(){
  cerrarEscanerImei();
  $("salidaForm").reset();
  $("fecha").value = new Date().toISOString().slice(0,10);
  cargarLineas();
  calcular();
}

function estado(msg, ok=true){
  const s = $("status");
  s.className = "status " + (ok ? "ok" : "err");
  s.textContent = msg;
}

[
 "costo","ventaEquipo","delivery","posFactura","posFactura2","delivery2","montoAccesorios2",
 "efectivo","montoTransferido","posZipago","yapePlin"
].forEach(id => $(id).addEventListener("input", calcular));
$("accesorios").addEventListener("change", calcular);

$("grupo").addEventListener("change", () => { cargarLineas(); calcular(); });
$("linea").addEventListener("change", () => { cargarModelos(); calcular(); });
$("modelo").addEventListener("change", () => { cargarColores(); calcular(); });
$("modeloManual").addEventListener("input", actualizarSublinea);
$("color").addEventListener("change", actualizarSublinea);

$("scanImeiBtn").addEventListener("click", iniciarEscanerImei);
$("closeScannerBtn").addEventListener("click", cerrarEscanerImei);
window.addEventListener("pagehide", cerrarEscanerImei);

$("limpiarBtn").addEventListener("click", limpiar);

$("salidaForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(!e.currentTarget.reportValidity()) return;
  if(!confirm("¿Deseas GUARDAR E IMPRIMIR esta salida?")) return;

  const registro = obtenerRegistro();
  try {
    guardarLocal(registro);
    await enviarABBDD(registro);
    estado("Salida guardada. Preparando impresión...", true);
    setTimeout(() => {
      window.print();
      limpiar();
    }, 150);
  } catch(err) {
    estado(err.message || "No se pudo guardar el registro.", false);
  }
});

$("fecha").value = new Date().toISOString().slice(0,10);
cargarLineas();
calcular();
</script>
